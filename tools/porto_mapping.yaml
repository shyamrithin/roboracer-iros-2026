# =============================================================================
# porto_mapping.yaml
# -----------------------------------------------------------------------------
# Project : RoboRacer Sim Racing League @ IROS 2026 - Team CEM Navigators (26)
# Author  : Shyam Rithin
# Location: ~/roboracer/tools/porto_mapping.yaml
# Usage   : ros2 launch slam_toolbox online_async_launch.py \
#             slam_params_file:=~/roboracer/tools/porto_mapping.yaml
# =============================================================================
#
# slam_toolbox async mapping, tuned for the Porto circuit as measured from the
# recorded log: trajectory bounding box 3.76 x 14.03 m, corridor roughly 2-3 m
# wide (median LiDAR return 1.06 m), lap length ~36 m.
#
# Deviations from the stock config and why:
#   * minimum_travel_distance 0.10 (stock 0.5) -- 0.5 m would give only ~70
#     nodes per lap on a 36 m circuit. 0.10 gives ~360, dense enough for
#     tight walls.
#   * max_laser_range 10.0 -- matches the sensor's true range_max.
#   * resolution 0.05 -- the 5 cm target for wall sharpness.
#   * loop closure left ON -- the car laps continuously, so revisits are
#     frequent and cheap to exploit.
#   * transform_publish_period 0.02 -- transforms tick at ~15.8 Hz, so the
#     publisher should be comfortably faster than the data.
# =============================================================================

slam_toolbox:
  ros__parameters:

    # ---- Plugins ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- Frames and topics ----
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ---- Node placement ----
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ---- Loop closure ----
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- Correlation search, coarse ----
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ---- Correlation search, loop closure ----
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- Scan matcher ----
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
